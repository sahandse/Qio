appId: com.sahandse.qio
productName: Qio
copyright: © 2026 sahandse

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - resources/*.png

extraResources:
  - from: resources/bridge
    to: bridge

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon-512.png

nsis:
  artifactName: Qio-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Qio
  deleteAppDataOnUninstall: false
