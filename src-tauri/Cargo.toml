[package]
name = "qio"
version = "0.1.0"
description = "Qio Persian AI companion"
authors = ["Qio contributors"]
edition = "2021"

[lib]
name = "qio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
