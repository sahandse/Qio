name: Qio Windows Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create (example: v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qio-windows-release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Detect version release
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $tag"
              exit 1
            fi
            should_release=true
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
            should_release=true
          else
            current_version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
            previous_version=""
            if git show HEAD^:package.json > /tmp/qio-previous-package.json 2>/dev/null; then
              previous_version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/qio-previous-package.json','utf8')).version)")
            fi
            if [[ "$current_version" != "$previous_version" ]]; then
              tag="v$current_version"
              should_release=true
            else
              tag="v$current_version"
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                should_release=false
              else
                should_release=true
              fi
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "Release requested: $should_release ($tag)"

  windows-release:
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install application dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Verify installer files exist
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".msi") }
          if (-not $files -or $files.Count -lt 1) {
            throw "No Windows installer (.exe or .msi) was generated."
          }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object Path, Hash | Format-List }

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".msi") } | Copy-Item -Destination release-assets
          Get-ChildItem release-assets -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content -Path release-assets/SHA256SUMS.txt
          }
          Get-ChildItem release-assets -File | Format-Table Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Qio ${{ needs.detect-release.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/SHA256SUMS.txt
