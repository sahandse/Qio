name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (for example v1.3.0)
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build installer
        shell: bash
        run: |
          set +e
          npm run dist -- --publish never 2>&1 | tee dist.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            error_line=$(grep -a "⨯" dist.log | tail -n 1 | tr -d '\r' | sed 's/::/:/g' | cut -c1-800)
            tail_line=$(tail -c 500 dist.log | tr -d '\r\n' | sed 's/::/:/g')
            echo "::error title=Installer error line::$error_line"
            echo "::error title=Installer log tail::$tail_line"
            exit "$status"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Qio ${{ inputs.tag || github.ref_name }}
          body: |
            ## تغییرات ۱.۴.۰

            - **تاریخ زیر ساعت:** کنار ساعت، روز هفته و تاریخ شمسی هم دیده می‌شود؛ روی نچ‌های باریک خودش جمع می‌شود.
            - **نوار پیشرفت لبه:** یک خط نازک پایین نچ، پیشرفت تمرکز یا آب امروز را نشان می‌دهد.
            - **حالت شب خودکار:** از ۹ شب تا ۷ صبح رنگ‌ها گرم و کم‌نور می‌شوند؛ از تنظیمات هم قابل خاموش‌کردن است.
            - **پنل‌های خالی یکدست:** قفسه، یادداشت و کارها حالا یک حالت خالی مشترک و مرتب دارند.
            - **بررسی نسخهٔ تازه:** Qio از گیت‌هاب خبر نسخهٔ جدید را می‌گیرد و با یک اعلان به صفحهٔ دانلود می‌فرستد؛ خودش چیزی نصب نمی‌کند.
            - **پایدارتر زیر پوست:** تنظیمات نسخه‌دار شد و از نسخه‌های قبلی خودکار مهاجرت می‌کند، ورودی‌های رابط اعتبارسنجی می‌شوند، ساعت جدا از بقیهٔ نچ رندر می‌شود و رفتار کاهش حرکت بهتر رعایت می‌شود.

            نصب‌کنندهٔ ویندوز: `Qio-Setup-1.4.0.exe`
          files: |
            release/Qio-Setup-*.exe
            release/latest.yml
