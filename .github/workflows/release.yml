name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (for example v1.3.0)
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        shell: bash
        run: |
          set +e
          npm run dist 2>&1 | tee dist.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            error_line=$(grep -a "⨯" dist.log | tail -n 1 | tr -d '\r' | sed 's/::/:/g' | cut -c1-800)
            tail_line=$(tail -c 500 dist.log | tr -d '\r\n' | sed 's/::/:/g')
            echo "::error title=Installer error line::$error_line"
            echo "::error title=Installer log tail::$tail_line"
            exit "$status"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Qio ${{ inputs.tag || github.ref_name }}
          body: |
            ## تغییرات ۱.۳.۰

            - **ساعت مهمان است:** نچ همیشه بالای صفحه می‌ماند و فقط ساعت هر ۱۰ دقیقه یک‌بار حدود ۱۲ ثانیه ظاهر می‌شود؛ با نگه‌داشتن نشانگر روی نچ یا باز کردن پنل، ساعت همان‌جا می‌ماند.
            - **چت هوش مصنوعی داخلی:** انتخاب سرویس‌دهنده (ایرانی و خارجی)، مدل و کلید API داخل تنظیمات؛ پاسخ‌ها زنده استریم می‌شوند و کلید فقط روی همین رایانه ذخیره می‌شود.
            - آیکون نمودار صوتی کنار ساعت حذف شد.
            - تنظیمات خلوت‌تر و دسته‌بندی‌شده شد؛ بخش «دربارهٔ ما» فقط آیدی تلگرام @sahandse است.

            نصب‌کنندهٔ ویندوز: `Qio-Setup-1.3.0.exe`
          files: |
            release/Qio-Setup-*.exe
            release/latest.yml
