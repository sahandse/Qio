name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (for example v1.3.0)
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        shell: bash
        run: |
          set +e
          { node -v; npm -v; node --import ./tests/register.mjs --test "tests/**/*.test.ts"; } > test.log 2>&1
          status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            {
              echo '## Test log'
              echo '```'
              tail -n 120 test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -a -E "not ok|✖|ℹ fail" test.log | head -n 4 | tr -d '\r' | sed 's/::/:/g' | while IFS= read -r line; do echo "::error title=Test summary::$line"; done
            grep -a -E "Error|error:|ERR_|Cannot|throw" test.log | head -n 5 | tr -d '\r' | sed 's/::/:/g' | while IFS= read -r line; do echo "::error title=Test error::$line"; done
            head -n 1 test.log | tr -d '\r' | sed 's/::/:/g' | while IFS= read -r line; do echo "::error title=Node::$line"; done
            exit "$status"
          fi

      - name: Build installer
        shell: bash
        run: |
          set +e
          npm run dist -- --publish never 2>&1 | tee dist.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            error_line=$(grep -a "⨯" dist.log | tail -n 1 | tr -d '\r' | sed 's/::/:/g' | cut -c1-800)
            tail_line=$(tail -c 500 dist.log | tr -d '\r\n' | sed 's/::/:/g')
            echo "::error title=Installer error line::$error_line"
            echo "::error title=Installer log tail::$tail_line"
            exit "$status"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Qio ${{ inputs.tag || github.ref_name }}
          body: |
            ## تغییرات ۱.۵.۱

            - **فوتبال:** برچسب هفتهٔ بازی در سربرگ مسابقه هم با اعداد فارسی نوشته می‌شود؛ رقم‌های لاتینِ فهرست ورزش۳ (مثل «هفته 11») دیگر در رابط دیده نمی‌شود.
            - باقی رفتار نسخهٔ ۱.۵.۰ دست‌نخورده است: جعبهٔ ابزار نچ، اجرای سریع، صفحهٔ اعلان‌ها، تب جدول فوتبال، چیدمان بنتو و به‌روزرسانی امن با کنترل SHA‑256.

            نصب‌کنندهٔ ویندوز: `Qio-Setup-1.5.1.exe`
          files: |
            release/Qio-Setup-*.exe
            release/latest.yml
