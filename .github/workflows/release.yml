name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (for example v1.3.0)
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        shell: bash
        run: |
          set +e
          { node -v; npm -v; node --import ./tests/register.mjs --test "tests/**/*.test.ts"; } > test.log 2>&1
          status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            {
              echo '## Test log'
              echo '```'
              tail -n 120 test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -a -E "not ok|✖|ℹ fail" test.log | head -n 4 | tr -d '\r' | sed 's/::/:/g' | while IFS= read -r line; do echo "::error title=Test summary::$line"; done
            grep -a -E "Error|error:|ERR_|Cannot|throw" test.log | head -n 5 | tr -d '\r' | sed 's/::/:/g' | while IFS= read -r line; do echo "::error title=Test error::$line"; done
            head -n 1 test.log | tr -d '\r' | sed 's/::/:/g' | while IFS= read -r line; do echo "::error title=Node::$line"; done
            exit "$status"
          fi

      - name: Build installer
        shell: bash
        run: |
          set +e
          npm run dist -- --publish never 2>&1 | tee dist.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            error_line=$(grep -a "⨯" dist.log | tail -n 1 | tr -d '\r' | sed 's/::/:/g' | cut -c1-800)
            tail_line=$(tail -c 500 dist.log | tr -d '\r\n' | sed 's/::/:/g')
            echo "::error title=Installer error line::$error_line"
            echo "::error title=Installer log tail::$tail_line"
            exit "$status"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Qio ${{ inputs.tag || github.ref_name }}
          body: |
            ## تغییرات ۱.۵.۰

            - **جعبهٔ ابزار نچ:** تب «ابزارها» حالا قهوه، ماشین‌حساب درصد و یکا، مونیتور سیستم، انتخاب رنگ از صفحه و ابزار خط‌کشی روی دسکتاپ دارد؛ تاریخچهٔ کلیپ‌بورد هم همان‌جاست و فقط در حافظه می‌ماند.
            - **اجرای سریع:** فایل، برنامه، پوشه یا سایت را پین کن و از تب «اجرا» با یک کلیک بازش کن؛ آیکون‌ها از خود ویندوز می‌آیند و سایت‌ها با مرورگر پیش‌فرض باز می‌شوند.
            - **اعلان‌ها:** هر نوتیفیکیشن Qio در صفحهٔ «اعلان‌ها» می‌ماند و همان‌جا جوابش را می‌دهی — «انجام شد»، «۱۰ دقیقهٔ دیگر»، «نوشیدم» و میان‌برها. اعلان‌های ویندوز هم آینه می‌شوند، اما فقط خواندنی.
            - **فوتبال کامل‌تر:** تا ده تیم، نتیجه و دقیقهٔ زنده، تایم‌لاین رویدادها و یک تب «جدول» با رده‌بندی کامل لیگ؛ گل، کارت قرمز و پایان بازی هم نوتیف می‌گیرند.
            - **ماسکوت زنده‌تر:** پلک طبیعی، چرت، نگاه‌های ساکادی و هدفمند، تنفس هماهنگ با تمرکز و جلوه‌های فصلی.
            - **چیدمان بنتو:** هر تب ۱×۱، ۲×۱ یا ۲×۲ می‌شود، ترتیب و پنهان‌کردنش با خودت است و نچ کنار چپ، وسط یا راست صفحه می‌نشیند.
            - **نچ جمع‌شدهٔ هوشمند:** جای ساعت، بازی زنده، شمارش تمرین یا فنجان قهوه دیده می‌شود.
            - **هوش مصنوعی گسترده‌تر:** Qoder، OpenCode Zen، Freebuff و ده‌ها سرویس سازگار با OpenAI با مدل‌های پیشنهادی بیشتر.
            - **به‌روزرسانی امن:** Qio نسخهٔ تازه را داخل خودش دانلود می‌کند و پیش از اجرا هش SHA‑256 فایل را با هش گیت‌هاب می‌سنجد؛ ناسازگاری یعنی نصب انجام نمی‌شود.
            - **ظاهر و حرکت:** سیستم طراحی مشترک با توکن‌ها، حرکت پله‌ای، صداهای نرم و حالت شب خودکار؛ ابزار QR حذف شد.

            نصب‌کنندهٔ ویندوز: `Qio-Setup-1.5.0.exe`
          files: |
            release/Qio-Setup-*.exe
            release/latest.yml
