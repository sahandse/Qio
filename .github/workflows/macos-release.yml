name: Qio macOS Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag to attach macOS builds to (for example v0.1.5)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: qio-macos-${{ github.event.release.tag_name || inputs.release_tag || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  detect-release:
    name: Decide whether to build and publish
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      should_publish: ${{ steps.detect.outputs.should_publish }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect release target
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RELEASE_TAG_EVENT: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          should_build=true
          should_publish=false

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag" >/dev/null 2>&1 || true
            tag_sha=$(git rev-parse "$tag^{commit}" 2>/dev/null || true)
            if [[ -n "$tag_sha" && "$tag_sha" == "$HEAD_SHA" ]]; then
              should_publish=true
            else
              should_build=false
            fi
          elif [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG_EVENT"
            should_publish=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$RELEASE_TAG_INPUT" ]]; then
              tag="$RELEASE_TAG_INPUT"
              should_publish=true
            fi
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "Build: $should_build; publish: $should_publish; tag: $tag"

  build:
    name: Build macOS (${{ matrix.target }})
    needs: detect-release
    if: needs.detect-release.outputs.should_build == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install application dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build macOS disk image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release -p qio-hook --target "$TARGET"
          npm run tauri build -- --target "$TARGET" --bundles dmg
          VERSION=$(node -p "require('./package.json').version")
          IMAGE=$(find "target/$TARGET/release/bundle/dmg" "src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' 2>/dev/null | head -n 1)
          if [ -z "$IMAGE" ]; then
            echo "No DMG was generated for $TARGET"
            exit 1
          fi
          mkdir -p release-assets
          cp "$IMAGE" "release-assets/Qio_${VERSION}_${TARGET}.dmg"
          shasum -a 256 "release-assets/Qio_${VERSION}_${TARGET}.dmg" > "release-assets/SHA256SUMS-macOS-${TARGET}.txt"
          ls -lh release-assets

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qio-macos-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-macos-assets:
    name: Attach macOS builds to GitHub Release
    needs: [detect-release, build]
    if: always() && needs.detect-release.outputs.should_publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qio-macos-*
          path: release-assets
          merge-multiple: true

      - name: Verify release files
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -name '*.dmg' -print
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -ge 2
          test "$(find release-assets -maxdepth 1 -type f -name 'SHA256SUMS-macOS-*.txt' | wc -l)" -ge 2

      - name: Publish macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-release.outputs.tag_name }}
          name: Qio ${{ needs.detect-release.outputs.tag_name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release-assets/*.dmg
            release-assets/SHA256SUMS-macOS-*.txt
